<!doctype html>
<html lang="en" data-theme="cyberpunk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <!-- Theme: applied before the stylesheet paints, so there is no flash of the wrong theme.
         Cyberpunk is the default; only a choice saved by the toggle overrides it (the system
         light/dark setting is not used). Keep the key and the default in sync with src/theme/theme.js. -->
    <script>
      (function () {
        var theme = 'cyberpunk';
        try {
          var saved = localStorage.getItem('mainframe.theme');
          if (saved === 'cyberpunk' || saved === 'professional') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'professional') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f7');
      })();
    </script>
    <meta name="description" content="MAINFRAME_OS — an interactive cyberpunk portfolio. Sector 01: a Proxmox home-lab blueprint." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Cpath d='M6 8l8 8-8 8M16 24h10' stroke='%2300f0ff' stroke-width='3' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>MAINFRAME_OS // Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
